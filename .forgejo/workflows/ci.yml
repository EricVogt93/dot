name: CI

# Forgejo is the primary repository; the GitHub mirror runs no workflows.
#
# Configuration (repository settings → Actions):
#   vars.REGISTRY              container registry host, e.g. registry.example.com
#                              (unset: the image is built but not pushed)
#   vars.REGISTRY_USER         registry user
#   secrets.REGISTRY_TOKEN     registry token/password
#   vars.DEPLOY_NAMESPACE      namespace of the dot Deployment (deploy job)
#   secrets.KUBE_CONFIG        kubeconfig for the deploy job
#   secrets.DEPLOY_KUSTOMIZATION
#                              kustomization.yaml of a private overlay; written
#                              to deploy/overlays/ci/ (see README, "Kubernetes")
#   vars.GITHUB_MIRROR_REPO    target GitHub repository ("owner/repo" or full
#                              https://github.com/owner/repo.git URL)
#   secrets.GITHUB_MIRROR_TOKEN
#                              GitHub token with Contents write permission
# The deploy and mirror jobs run on main only and are skipped when unset.

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  verify:
    runs-on: general
    strategy:
      matrix:
        node: [22, 24]
    container:
      image: node:${{ matrix.node }}-bookworm-slim
    steps:
      - name: Install tooling
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends bash ca-certificates coreutils curl git jq util-linux
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Syntax checks
        working-directory: docker
        run: npm run lint
      - name: Unit and integration tests
        working-directory: docker
        run: npm test

  render:
    runs-on: general
    container:
      image: node:24-bookworm-slim
    steps:
      - name: Install tooling
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git python3 python3-yaml
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install kubectl
        run: |
          curl -fsSLo /usr/local/bin/kubectl \
            https://dl.k8s.io/release/v1.35.9/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl
      - name: Deployment render tests
        run: python3 -m unittest discover -s deploy -p test_render.py

  image:
    needs: [verify, render]
    runs-on: general
    container:
      image: docker:27-cli
      # Runner-specific: rootless Podman socket of the runner host.
      options: -v /run/user/1000/podman/podman.sock:/var/run/docker.sock
    env:
      REGISTRY_USER: ${{ vars.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    outputs:
      image_ref: ${{ steps.digest.outputs.image_ref }}
    steps:
      - name: Install action runtime
        run: apk add --no-cache bash curl git jq nodejs
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve image
        id: image
        env:
          REPOSITORY: ${{ forgejo.repository }}
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$FORGEJO_OUTPUT"
          if [ -n "$REGISTRY" ]; then
            echo "name=$REGISTRY/$REPOSITORY" >> "$FORGEJO_OUTPUT"
          else
            echo "name=$REPOSITORY" >> "$FORGEJO_OUTPUT"
          fi
      - name: Build image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ steps.image.outputs.revision }}
          SOURCE_URL: ${{ forgejo.server_url }}/${{ forgejo.repository }}
        run: |
          docker build --network=host \
            --build-arg "DOT_SOURCE_URL=$SOURCE_URL" \
            --tag "$IMAGE:$REVISION" \
            docker
      - name: Verify built image (offline smoke, before any push)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: DOT_TEST_IMAGE="$IMAGE:$REVISION" bash docker/verify-image.sh
      - name: Push image
        if: forgejo.event_name == 'push'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ steps.image.outputs.revision }}
          TARGET_REF: ${{ forgejo.ref }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "vars.REGISTRY is not set; skipping push"
            exit 0
          fi
          : "${REGISTRY_USER:?Forgejo variable REGISTRY_USER is required}"
          : "${REGISTRY_TOKEN:?Forgejo secret REGISTRY_TOKEN is required}"
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:$REVISION"
          if [ "$TARGET_REF" = "refs/heads/main" ]; then
            docker tag "$IMAGE:$REVISION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          else
            docker tag "$IMAGE:$REVISION" "$IMAGE:dev"
            docker push "$IMAGE:dev"
          fi
      - name: Resolve registry digest of the built image
        id: digest
        if: forgejo.event_name == 'push'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "vars.REGISTRY is not set; no digest output (deploy stays disabled)"
            exit 0
          fi
          : "${REGISTRY_USER:?Forgejo variable REGISTRY_USER is required}"
          : "${REGISTRY_TOKEN:?Forgejo secret REGISTRY_TOKEN is required}"
          # Local RepoDigests can be stale (podman recompresses layers on
          # push). The registry's own digest for the pushed tag is the only
          # deployable truth.
          REPO="${IMAGE#"$REGISTRY/"}"
          ACCEPT='Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'
          HEADERS="$(curl -fsS -o /dev/null -D - "https://$REGISTRY/v2/" || true)"
          AUTH_ARGS=()
          WWW="$(printf '%s' "$HEADERS" | grep -i '^www-authenticate:' || true)"
          if [ -n "$WWW" ]; then
            REALM="$(printf '%s' "$WWW" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')"
            SERVICE="$(printf '%s' "$WWW" | sed -n 's/.*service="\([^"]*\)".*/\1/p')"
            TOKEN="$(curl -fsS -u "$REGISTRY_USER:$REGISTRY_TOKEN" \
              "$REALM?service=$SERVICE&scope=repository:$REPO:pull" | jq -r '.token // .access_token')"
            AUTH_ARGS=(-H "Authorization: Bearer $TOKEN")
          else
            AUTH_ARGS=(-u "$REGISTRY_USER:$REGISTRY_TOKEN")
          fi
          DIGEST="$(curl -fsS -o /dev/null -D - "${AUTH_ARGS[@]}" -H "$ACCEPT" \
            "https://$REGISTRY/v2/$REPO/manifests/$REVISION" \
            | grep -i '^docker-content-digest:' | tr -d '\r' | awk '{print $2}')"
          case "$DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "registry returned no usable digest for $IMAGE:$REVISION: '$DIGEST'" >&2; exit 1 ;;
          esac
          echo "image_ref=$IMAGE@$DIGEST" >> "$FORGEJO_OUTPUT"

  deploy:
    needs: image
    runs-on: general
    if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' && success()
    container:
      image: alpine:3.20
    env:
      IMAGE_REF: ${{ needs.image.outputs.image_ref }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      DEPLOY_KUSTOMIZATION: ${{ secrets.DEPLOY_KUSTOMIZATION }}
      DEPLOY_NAMESPACE: ${{ vars.DEPLOY_NAMESPACE }}
    steps:
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$REGISTRY" ] || [ -z "$IMAGE_REF" ] || [ -z "$KUBE_CONFIG" ] || [ -z "$DEPLOY_KUSTOMIZATION" ] || [ -z "$DEPLOY_NAMESPACE" ]; then
            echo "deploy not configured (REGISTRY, image digest, KUBE_CONFIG, DEPLOY_KUSTOMIZATION, DEPLOY_NAMESPACE); skipping"
            echo "enabled=false" >> "$FORGEJO_OUTPUT"
          else
            echo "enabled=true" >> "$FORGEJO_OUTPUT"
          fi
      - name: Install action runtime
        if: steps.config.outputs.enabled == 'true'
        run: apk add --no-cache ca-certificates curl git nodejs python3 py3-yaml
      - name: Check out repository
        if: steps.config.outputs.enabled == 'true'
        uses: https://data.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install kubectl
        if: steps.config.outputs.enabled == 'true'
        run: |
          curl -fsSLo /usr/local/bin/kubectl \
            https://dl.k8s.io/release/v1.35.9/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl
      - name: Write kubeconfig and overlay
        if: steps.config.outputs.enabled == 'true'
        run: |
          mkdir -p /root/.kube deploy/overlays/ci
          printf '%s' "$KUBE_CONFIG" > /root/.kube/config
          chmod 600 /root/.kube/config
          printf '%s\n' "$DEPLOY_KUSTOMIZATION" > deploy/overlays/ci/kustomization.yaml
      - name: Render qualified manifests
        if: steps.config.outputs.enabled == 'true'
        run: |
          # One fully determined manifest set: only the dot container image
          # is replaced, by the exact digest built and verified in this run.
          python3 deploy/render.py deploy/overlays/ci "$IMAGE_REF" > qualified.yaml
      - name: Apply manifests
        if: steps.config.outputs.enabled == 'true'
        run: kubectl apply -f qualified.yaml
      - name: Wait for rollout
        if: steps.config.outputs.enabled == 'true'
        run: |
          kubectl -n "$DEPLOY_NAMESPACE" rollout status deployment/dot --timeout=300s
          kubectl -n "$DEPLOY_NAMESPACE" get pods -l app=dot -o wide

  mirror:
    needs: verify
    runs-on: general
    if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' && success()
    container:
      image: alpine:3.20
    env:
      GITHUB_MIRROR_REPO: ${{ vars.GITHUB_MIRROR_REPO }}
      GITHUB_MIRROR_USER: ${{ vars.GITHUB_MIRROR_USER }}
      GITHUB_MIRROR_TOKEN: ${{ secrets.GITHUB_MIRROR_TOKEN }}
    steps:
      - name: Check mirror configuration
        id: config
        run: |
          if [ -z "$GITHUB_MIRROR_REPO" ] || [ -z "$GITHUB_MIRROR_TOKEN" ]; then
            echo "GitHub mirror not configured (GITHUB_MIRROR_REPO, GITHUB_MIRROR_TOKEN); skipping"
            echo "enabled=false" >> "$FORGEJO_OUTPUT"
          else
            echo "enabled=true" >> "$FORGEJO_OUTPUT"
          fi
      - name: Install action runtime
        if: steps.config.outputs.enabled == 'true'
        run: apk add --no-cache ca-certificates git nodejs
      - name: Check out repository
        if: steps.config.outputs.enabled == 'true'
        uses: https://data.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push main to GitHub mirror
        if: steps.config.outputs.enabled == 'true'
        run: |
          case "$GITHUB_MIRROR_REPO" in
            https://*) TARGET_URL="$GITHUB_MIRROR_REPO" ;;
            *) TARGET_URL="https://github.com/${GITHUB_MIRROR_REPO%.git}.git" ;;
          esac
          USER="${GITHUB_MIRROR_USER:-x-access-token}"
          AUTH="$(printf '%s:%s' "$USER" "$GITHUB_MIRROR_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push --force "$TARGET_URL" HEAD:refs/heads/main --tags


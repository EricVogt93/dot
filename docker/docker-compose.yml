name: dot

# Default setup: bridge networking with the API published on host loopback
# only. On hosts that cannot create bridge/veth interfaces, add the override:
#   docker compose -f docker-compose.yml -f docker-compose.host-network.yml up -d
services:
  dot:
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.167.0}
    image: ${DOT_IMAGE:-dot:local}
    container_name: ${DOT_CONTAINER_NAME:-dot}
    hostname: ${DOT_HOSTNAME:-dot-sandbox}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # Published on 127.0.0.1 only. Do not change to 0.0.0.0 without DOT_API_KEY.
      - "127.0.0.1:${DOT_PORT:-8787}:8787"
    volumes:
      - dot-data:/data
      - ${DOT_WORKSPACE_HOST:-./workspace}:/workspace
      # Optional auth seed. Must point to an existing file; an empty file
      # enables device login. A directory mount is rejected at startup.
      - ${DOT_AUTH_FILE:-${HOME}/.codex/auth.json}:/seed/auth.json:ro
    environment:
      CODEX_HOME: /data/codex
      DOT_API_PORT: "8787"
      # Inside the container network namespace; reachable only through the
      # loopback port mapping above.
      DOT_BIND: 0.0.0.0
      DOT_AUTH_SEED: /seed/auth.json
      DOT_DEVICE_LOGIN: ${DOT_DEVICE_LOGIN:-1}
      DOT_MODEL: ${DOT_MODEL:-}
      DOT_API_KEY: ${DOT_API_KEY:-}
      DOT_CORS_ORIGINS: ${DOT_CORS_ORIGINS:-}
      DOT_ANALYTICS: ${DOT_ANALYTICS:-0}
      DOT_SANDBOX: ${DOT_SANDBOX:-danger-full-access}
      DOT_APPROVAL_POLICY: ${DOT_APPROVAL_POLICY:-never}
      DOT_THREAD_MODE: ${DOT_THREAD_MODE:-persistent}
      DOT_DOTS_EXECUTOR: ${DOT_DOTS_EXECUTOR:-0}
      DOT_DOTS_NAME: ${DOT_DOTS_NAME:-}
      DOT_DOTS_ATTACH: ${DOT_DOTS_ATTACH:-1}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${DOT_API_PORT}/readyz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  dot-data:
